
name: "CI"

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    build:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
            - name: "Setup .NET"
              uses: actions/setup-dotnet@v6
              with:
                global-json-file: ./global.json
            - name: "Restore dependencies"
              run: dotnet restore
            - name: "Build"
              run: dotnet build --no-restore
            - name: "Run tests"
              run: dotnet test --no-build --verbosity normal


