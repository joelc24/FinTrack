
name: "CI"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: "Setup .NET"
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json
      - name: "Restore dependencies"
        run: dotnet restore
      - name: "Build"
        run: dotnet build --no-restore
      - name: "Run Unit Tests"
        run: dotnet test tests/FinTrack.Domain.UnitTests --no-build --verbosity normal --logger trx --results-directory ./TestResults
      - name: "Run Integration Tests"
        run: dotnet test tests/FinTrack.IntegrationTests --no-build --verbosity normal --logger trx --results-directory ./TestResults"
      - name: "Upload test results"
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-test-results
          path: ./TestResults
          retention-days: 5
        if: ${{ !cancelled() }}

  docker-build:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4
      - name: "Build Docker image"
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/FinTrack.WebApi/Dockerfile
          push: false

  publish:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/joelc24/fintrack
          tags: |
            type=ref,event=branch
            type=sha
      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4
      - name: "Build and push Docker image"
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          file: src/FinTrack.WebApi/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}