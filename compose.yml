services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fintrack-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
    ports:
      - "${SQLSERVER_HOST_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${DB_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/FinTrack.WebApi/Dockerfile
    container_name: fintrack-api
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=FinTrack;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;Encrypt=False;
      - Jwt__SecretKey=${JWT_SECRET_KEY}
      - ASPNETCORE_ENVIRONMENT=Development


volumes:
  sqlserver-data:
